name: swift_app
description: "Swift rider and driver app with live matching and ride offers."
publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  get: ^4.7.3
  geolocator: ^14.0.3
  google_maps_flutter: ^2.14.0
  google_maps_flutter_android: ^2.19.10
  google_maps_flutter_platform_interface: ^2.16.1
  uuid: ^4.5.2
  shared_preferences: ^2.5.3
  geocoding: ^5.0.0
  stomp_dart_client: ^2.1.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  razorpay_flutter: ^1.4.7
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/swift-app-icon.png
    - assets/images/
    - assets/images/vehicles/
    - assets/icons/
    - assets/icons/lucide/
    - assets/fonts/poppins/OFL.txt

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
