spring:
  datasource:
    url: jdbc:h2:mem:userservice_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: 127.0.0.1:1
    listener:
      auto-startup: false
  data:
    redis:
      host: 127.0.0.1
      port: 1

eureka:
  client:
    enabled: false
