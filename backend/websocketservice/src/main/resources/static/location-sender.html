<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send Location</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --text: #17202a;
            --muted: #667085;
            --line: #d8dee6;
            --accent: #0f766e;
            --accent-dark: #115e59;
            --danger: #b42318;
            --ok: #087443;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(980px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
        }

        .status {
            min-width: 120px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            font-weight: 700;
        }

        .status.connected {
            color: var(--ok);
        }

        .status.error {
            color: var(--danger);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 18px;
            align-items: start;
        }

        form,
        .output {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 11px;
            color: var(--text);
            background: #ffffff;
            font: inherit;
        }

        input:focus,
        select:focus {
            outline: 2px solid rgba(15, 118, 110, 0.2);
            border-color: var(--accent);
        }

        .wide {
            grid-column: 1 / -1;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            height: 42px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 0 16px;
            background: var(--accent);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: #ffffff;
            color: var(--accent-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        pre {
            min-height: 364px;
            max-height: 520px;
            margin: 0;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #101828;
            font-size: 13px;
            line-height: 1.45;
        }

        @media (max-width: 760px) {
            header,
            .layout {
                grid-template-columns: 1fr;
            }

            header {
                align-items: stretch;
                display: grid;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Send Location</h1>
        <div id="status" class="status">Disconnected</div>
    </header>

    <div class="layout">
        <form id="locationForm">
            <div class="grid">
                <label>
                    Driver State
                    <select id="locationMode">
                        <option value="AVAILABLE">Available</option>
                        <option value="ACTIVE_RIDE">Active Ride</option>
                    </select>
                </label>

                <label>
                    Ride ID
                    <input id="rideId" type="number" min="1" disabled>
                </label>

                <label>
                    Driver ID
                    <input id="driverId" type="number" value="11" min="1" required>
                </label>

                <label>
                    Rider ID
                    <input id="riderId" type="number" min="1" disabled>
                </label>

                <label>
                    Direction
                    <select id="direction">
                        <option>NORTH</option>
                        <option>SOUTH</option>
                        <option>EAST</option>
                        <option>WEST</option>
                    </select>
                </label>

                <label>
                    Latitude
                    <input id="latitude" type="number" value="28.6139" step="0.000001" required>
                </label>

                <label>
                    Longitude
                    <input id="longitude" type="number" value="77.2090" step="0.000001" required>
                </label>

                <label class="wide">
                    Nearby Place
                    <input id="nearByPlace" type="text" value="Delhi" required>
                </label>
            </div>

            <div class="actions">
                <button id="connectButton" class="secondary" type="button">Reconnect</button>
                <button id="sendButton" type="submit" disabled>Send</button>
            </div>
        </form>

        <section class="output">
            <h2>Sent Payloads</h2>
            <pre id="log"></pre>
        </section>
    </div>
</main>

<script>
    const socketUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host || "localhost:8085"}/ws-native`;
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const sendButton = document.getElementById("sendButton");
    const connectButton = document.getElementById("connectButton");
    const form = document.getElementById("locationForm");
    const locationModeInput = document.getElementById("locationMode");
    const rideIdInput = document.getElementById("rideId");
    const riderIdInput = document.getElementById("riderId");

    let socket;
    let connected = false;

    function stompFrame(command, headers = {}, body = "") {
        const headerLines = Object.entries(headers)
            .map(([key, value]) => `${key}:${value}`)
            .join("\n");

        return `${command}\n${headerLines}\n\n${body}\0`;
    }

    function setStatus(text, className = "") {
        statusEl.textContent = text;
        statusEl.className = `status ${className}`.trim();
    }

    function appendLog(label, value) {
        const timestamp = new Date().toLocaleTimeString();
        logEl.textContent = `[${timestamp}] ${label}\n${JSON.stringify(value, null, 2)}\n\n${logEl.textContent}`;
    }

    function setRideFieldsEnabled(enabled) {
        rideIdInput.disabled = !enabled;
        riderIdInput.disabled = !enabled;
        rideIdInput.required = enabled;
        riderIdInput.required = enabled;

        if (enabled) {
            rideIdInput.value = rideIdInput.value || "101";
            riderIdInput.value = riderIdInput.value || "22";
            return;
        }

        rideIdInput.value = "";
        riderIdInput.value = "";
    }

    function parseFrames(data) {
        return String(data)
            .split("\0")
            .map((frame) => frame.trim())
            .filter(Boolean);
    }

    function connect() {
        connected = false;
        sendButton.disabled = true;

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
        }

        setStatus("Connecting");
        socket = new WebSocket(socketUrl);

        socket.onopen = () => {
            socket.send(stompFrame("CONNECT", {
                "accept-version": "1.2",
                "heart-beat": "0,0"
            }));
        };

        socket.onmessage = (event) => {
            for (const frame of parseFrames(event.data)) {
                if (frame.startsWith("CONNECTED")) {
                    connected = true;
                    sendButton.disabled = false;
                    setStatus("Connected", "connected");
                }
            }
        };

        socket.onerror = () => {
            setStatus("Error", "error");
        };

        socket.onclose = () => {
            connected = false;
            sendButton.disabled = true;
            setStatus("Disconnected");
        };
    }

    function readPayload() {
        const payload = {
            driverId: Number(document.getElementById("driverId").value),
            latitude: Number(document.getElementById("latitude").value),
            longitude: Number(document.getElementById("longitude").value),
            nearByPlace: document.getElementById("nearByPlace").value,
            direction: document.getElementById("direction").value
        };

        if (locationModeInput.value === "ACTIVE_RIDE") {
            payload.rideId = Number(rideIdInput.value);
            payload.riderId = Number(riderIdInput.value);
        }

        return payload;
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!connected) {
            return;
        }

        const payload = readPayload();
        const body = JSON.stringify(payload);
        socket.send(stompFrame("SEND", {
            destination: "/app/location",
            "content-type": "application/json"
        }, body));

        appendLog("SEND /app/location", payload);
    });

    connectButton.addEventListener("click", connect);
    locationModeInput.addEventListener("change", () => {
        setRideFieldsEnabled(locationModeInput.value === "ACTIVE_RIDE");
    });

    setRideFieldsEnabled(false);
    connect();
</script>
</body>
</html>
