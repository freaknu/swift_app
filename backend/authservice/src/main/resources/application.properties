secret_key=${JWT_SECRET_KEY}
# Access token: 30 days
jwt_expiration=2592000000

# Refresh token: 90 days
refresh_expiration=7776000000
# Local JVM services are reached through the gateway on this machine.
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_ADVERTISE_ADDRESS:127.0.0.1}
