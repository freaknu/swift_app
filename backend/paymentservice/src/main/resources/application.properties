server.port=${PAYMENT_SERVICE_PORT:9910}
server.address=${SERVICE_BIND_ADDRESS:127.0.0.1}
spring.application.name=payment-service
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
services.rider-url=${RIDER_SERVICE_URL:http://localhost:8083}
services.user-url=${USER_SERVICE_URL:http://localhost:8082}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/paymentservice_db}
spring.datasource.username=${DB_USERNAME:swiftapp}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=PaymentServicePool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_ADVERTISE_ADDRESS:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${server.port}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
payment.consumer.enabled=${PAYMENT_CONSUMER_ENABLED:true}
payment.outbox.enabled=${PAYMENT_OUTBOX_ENABLED:true}
payment.outbox.interval-ms=${PAYMENT_OUTBOX_INTERVAL_MS:1000}
