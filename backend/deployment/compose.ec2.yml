# Preserve the existing `backend` project and volumes; infrastructure stays local.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
  kafka:
    ports: !override
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
